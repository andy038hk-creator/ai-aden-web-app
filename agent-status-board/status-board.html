<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aden Studio · Office</title>
  <link rel="stylesheet" href="office.css" />
</head>
<body>
  <header class="banner">
    <span class="tag">ADEN STUDIO</span>
    <strong>Office</strong>
    <span class="note" id="source-note">等待狀態資料…</span>
    <span class="clock" id="hk-clock"></span>
    <span class="tools">
      <label class="file-btn">載入 JSON<input id="file-input" type="file" accept="application/json,.json" /></label>
      <button type="button" class="text-btn" id="btn-reload">重新讀取</button>
    </span>
    <div class="legend">
      <span class="l-confirm">等 CONFIRM</span>
      <span class="l-working">working</span>
      <span class="l-idle">idle</span>
      <span class="l-stale">stale &gt;4h</span>
    </div>
  </header>

  <div class="stage">
    <div class="floor-wrap" id="floor-wrap">
      <div class="room" id="room" aria-label="Aden Studio floor"></div>
    </div>
    <aside class="panel" id="panel">
      <div>
        <h2>Team</h2>
        <div class="team-list" id="team-list"></div>
      </div>
      <div class="activity">
        <h2>Activity</h2>
        <div id="activity"></div>
      </div>
      <div>
        <h2>Stats · click tab</h2>
        <div class="tabs" role="tablist">
          <button type="button" class="active" data-tab="week" role="tab" aria-selected="true">本週</button>
          <button type="button" data-tab="month" role="tab" aria-selected="false">本月</button>
        </div>
        <div id="tab-week" class="tab-pane show" role="tabpanel"></div>
        <div id="tab-month" class="tab-pane" role="tabpanel"></div>
      </div>
      <p class="hint">
        右欄刻意做薄：Team＋Activity 常駐；week／month 要用 tab 先睇。<br />
        Floor：身份分區＋walkway；茶水間／休息室／乒乓係休息點。<br />
        working／CONFIRM 返自己檯；idle、bored、rest、done 行去空位。lastActive 超過 4 小時標 &gt;4h。
      </p>
    </aside>
  </div>
  <noscript><p class="noscript">要 JavaScript 先睇到 office 同狀態。</p></noscript>
