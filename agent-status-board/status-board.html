<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grok Agent 狀態板</title>
<style>
  :root {
    --floor: #c4a574; --floor-line: #b8956a; --desk-top: #a67c2a;
    --dash-bg: #0d1520; --dash-card: #162032; --dash-border: #243044;
    --text: #e8eef6; --muted: #8a9bb0; --green: #3dcf7a; --yellow: #e8c547;
    --blue: #4da3ff; --orange: #f0a05a; --tag-bg: #1a1a1a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: #080c12; color: var(--text); min-height: 100vh; overflow-x: hidden;
  }
  .app {
    display: grid; grid-template-columns: 1fr minmax(280px, 360px);
    min-height: 100vh; max-width: 1480px; margin: 0 auto;
  }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; } }

  .office {
    background: repeating-linear-gradient(90deg, var(--floor) 0 28px, var(--floor-line) 28px 30px);
    position: relative; padding: 20px 20px 28px; min-height: 720px; image-rendering: pixelated;
  }
  .office-skyline { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .window {
    flex: 1; background: linear-gradient(#87b8e0,#c5dff0 60%,#e8f0e0);
    border: 4px solid #5a4030; height: 72px; position: relative; overflow: hidden;
  }
  .window::before {
    content: ""; position: absolute; bottom: 0; left: 10%; right: 10%; height: 28px;
    background: linear-gradient(90deg,#3a4a5c 0 8px,transparent 8px 14px,#2a3a4c 14px 22px,transparent 22px 30px,#4a5a6c 30px 40px,transparent 40px);
  }
  .window-label {
    position: absolute; top: 4px; left: 6px; font-size: 10px; color: #1a2a3a;
    background: rgba(255,255,255,.7); padding: 1px 4px; font-weight: 600;
  }
  .bar-area {
    width: 120px; background: #6b4423; border: 3px solid #4a2e18;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 6px;
  }
  .bar-area .bottles { display: flex; gap: 4px; margin-bottom: 4px; }
  .bar-area .bottle { width: 8px; height: 18px; background: #3a8; border: 1px solid #266; }
  .bar-area .bottle:nth-child(2) { background: #a53; height: 14px; }
  .bar-area .bottle:nth-child(3) { background: #58a; height: 20px; }

  .office-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 20px 24px; align-items: start; }
  .desk-col { display: flex; flex-direction: column; gap: 22px; }

  .desk {
    background: var(--desk-top); border: 3px solid #5c4010; border-radius: 2px;
    width: 176px; padding: 20px 8px 10px; position: relative; box-shadow: 3px 3px 0 #00000033;
  }
  .status-placard {
    position: absolute; top: -14px; left: 50%; transform: translateX(-50%); z-index: 5;
    font-size: 11px; font-weight: 800; letter-spacing: .06em; padding: 3px 8px;
    border: 2px solid #111; box-shadow: 2px 2px 0 #00000055; white-space: nowrap;
    animation: placardPulse 1.1s steps(2, end) infinite;
  }
  .status-placard.working { background: #ff6b3d; color: #fff8f0; }
  .status-placard.done_recent { background: #3dcf7a; color: #0a2010; }
  .status-placard.idle_fresh { background: #7a8a9a; color: #e8eef6; animation: placardPulseSlow 2.4s steps(2,end) infinite; }
  .status-placard.bored { background: #2e2e3a; color: #9a9ab0; animation: placardPulseSlow 3.2s steps(2,end) infinite; }
  @keyframes placardPulse {
    0%,100% { opacity: 1; transform: translateX(-50%) translateY(0); }
    50% { opacity: .35; transform: translateX(-50%) translateY(-1px); }
  }
  @keyframes placardPulseSlow { 0%,100% { opacity: .85; } 50% { opacity: .3; } }

  .desk .name-tag {
    background: var(--tag-bg); color: #fff; font-size: 11px; font-weight: 600;
    padding: 2px 6px; margin: 4px auto 6px; width: fit-content; max-width: 160px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid #333;
  }

  /* Weekly completion strip (Mon–Sun HK) — volume-scaled bars */
  .desk .week-stats {
    margin: 0 auto 6px; padding: 3px 4px 4px;
    background: #1a140ecc; border: 1px solid #3a2a18; border-radius: 2px;
    width: 100%; max-width: 160px; text-align: center;
  }
  .desk .week-stats .week-total {
    font-size: 9px; font-weight: 700; color: #f0e6d0; letter-spacing: .02em;
    margin-bottom: 2px; line-height: 1.2;
  }
  .desk .week-stats .week-total .num {
    color: #3dcf7a; font-size: 12px; font-weight: 800;
  }
  .desk .week-stats .week-total .num.zero { color: #8a9bb0; }
  .desk .week-bars {
    display: flex; gap: 2px; justify-content: center; align-items: flex-end;
    height: 28px; padding-top: 2px;
  }
  .desk .week-bars .d {
    width: 14px; height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end; gap: 0;
    position: relative;
  }
  .desk .week-bars .d .cnt {
    font-size: 7px; font-weight: 800; color: #b8f0c8; line-height: 1;
    height: 8px; margin-bottom: 1px;
  }
  .desk .week-bars .d.empty .cnt { visibility: hidden; }
  .desk .week-bars .d .bar {
    width: 9px; min-height: 2px; background: #3dcf7a; border: 1px solid #1a3a28;
    border-radius: 1px 1px 0 0; image-rendering: pixelated;
    box-shadow: 0 0 0 0 #0000;
  }
  .desk .week-bars .d.empty .bar {
    background: #2a3038; border-color: #1a1e24; min-height: 2px; height: 2px !important; opacity: .5;
  }
  .desk .week-bars .d .wd {
    font-size: 7px; color: #8a9bb0; line-height: 1; font-weight: 600; margin-top: 1px;
  }
  .desk .week-bars .d.empty .wd { color: #5a6570; }
  .desk .week-meta {
    font-size: 8px; color: #8a9bb0; margin-top: 2px; line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .week-legend {
    text-align: center; font-size: 10px; color: #c8b8a0; margin: -6px 0 12px;
    letter-spacing: .02em;
  }

  /* 本週工作量排行 */
  .week-rank-list { display: flex; flex-direction: column; gap: 5px; }
  .week-rank-row {
    display: grid; grid-template-columns: 14px 1fr auto; gap: 6px; align-items: center;
    font-size: 11px; color: var(--text);
  }
  .week-rank-row .rk {
    font-size: 10px; font-weight: 800; color: var(--yellow); text-align: center;
  }
  .week-rank-row .rk.top { color: #3dcf7a; }
  .week-rank-row .who {
    min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-weight: 600;
  }
  .week-rank-row .who .spark {
    display: flex; gap: 1px; align-items: flex-end; height: 10px; margin-top: 2px;
  }
  .week-rank-row .who .spark i {
    display: block; width: 3px; background: #3dcf7a; border-radius: 0;
    min-height: 1px; opacity: .9;
  }
  .week-rank-row .who .spark i.z { background: #2a3038; opacity: .45; height: 1px !important; }
  .week-rank-row .tot {
    font-weight: 800; color: #3dcf7a; font-size: 12px; font-variant-numeric: tabular-nums;
  }
  .week-rank-row .tot.zero { color: #8a9bb0; }

  .desk-inner { display: flex; align-items: flex-end; gap: 8px; justify-content: center; }

  .monitor {
    width: 36px; height: 28px; background: #1a2030; border: 2px solid #333;
    position: relative; flex-shrink: 0;
  }
  .monitor::after {
    content: ""; position: absolute; bottom: -6px; left: 12px; width: 10px; height: 6px; background: #444;
  }
  .monitor .screen { width: 100%; height: 100%; background: #2a4058; }
  .monitor.working .screen { background: #2a6a4a; animation: blink 1.6s infinite; }
  .monitor.waiting .screen { background: #6a5a2a; }
  .monitor.completed .screen { background: #2a4a6a; }
  .monitor.idle .screen { background: #2a3038; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .7; } }

  /* Sheet-cropped character */
  .px-char {
    position: relative; width: 48px; height: 64px; flex-shrink: 0; image-rendering: pixelated;
  }
  .px-char img.sprite {
    width: 48px; height: 64px; object-fit: contain; object-position: bottom center;
    display: block; image-rendering: pixelated;
  }
  .px-char .status-dot {
    position: absolute; top: 0; right: -2px; width: 8px; height: 8px; border-radius: 50%;
    border: 1.5px solid #111; z-index: 3;
  }
  .px-char .status-dot.working { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .px-char .status-dot.waiting { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
  .px-char .status-dot.idle { background: #889; }
  .px-char .status-dot.completed { background: var(--blue); box-shadow: 0 0 6px var(--blue); }

  /* Mood FX — 4 moods only: working / done_recent / idle_fresh / bored */
  .mood-fx {
    position: absolute; inset: 0; pointer-events: none; z-index: 2;
  }

  /* --- working: multi sweat + bob --- */
  .mood-fx .sweat {
    position: absolute; width: 5px; height: 8px;
    background: #7ec8ff; border: 1px solid #3a7aaa; border-radius: 40% 40% 55% 55%;
    animation: sweatFall 0.85s steps(3,end) infinite;
  }
  .mood-fx .sweat.s1 { top: 12%; right: 2%; animation-delay: 0s; }
  .mood-fx .sweat.s2 { top: 18%; right: 12%; width: 4px; height: 6px; animation-delay: .28s; opacity: .85; }
  .mood-fx .sweat.s3 { top: 10%; right: -4%; width: 4px; height: 7px; animation-delay: .52s; opacity: .7; }
  .mood-fx .speed {
    position: absolute; left: -2%; top: 28%; width: 10px; height: 2px;
    background: linear-gradient(90deg, transparent, #fff8 60%, transparent);
    box-shadow: 0 4px 0 #fff6, 0 8px 0 #fff4;
    animation: speedDash 0.55s steps(2,end) infinite;
    opacity: .55;
  }
  @keyframes sweatFall {
    0%   { transform: translateY(0) scaleY(1); opacity: 1; }
    50%  { transform: translateY(3px) scaleY(1.15); opacity: .85; }
    100% { transform: translateY(7px) scaleY(.9); opacity: .15; }
  }
  @keyframes speedDash {
    0%,100% { transform: translateX(0); opacity: .5; }
    50% { transform: translateX(-3px); opacity: .85; }
  }

  /* --- done_recent: smile + blush + happy pulse --- */
  .mood-fx .smile {
    position: absolute; left: 50%; top: 36%; transform: translateX(-50%);
    width: 12px; height: 6px; border: 2px solid #1a1010; border-top: none;
    border-radius: 0 0 10px 10px; background: transparent;
    animation: smilePulse 2.4s ease-in-out infinite;
  }
  .mood-fx .blush {
    position: absolute; top: 34%; width: 6px; height: 4px; background: #e07090aa; border-radius: 50%;
    animation: blushGlow 2.4s ease-in-out infinite;
  }
  .mood-fx .blush.l { left: 18%; } .mood-fx .blush.r { right: 18%; }
  .mood-fx .spark {
    position: absolute; top: 6%; right: 0; font-size: 9px; line-height: 1;
    animation: sparkPop 2.4s steps(2,end) infinite;
  }
  @keyframes smilePulse {
    0%,100% { transform: translateX(-50%) scale(1); }
    40% { transform: translateX(-50%) scale(1.12); }
    55% { transform: translateX(-50%) scale(1.05); }
  }
  @keyframes blushGlow {
    0%,100% { opacity: .55; }
    50% { opacity: 1; }
  }
  @keyframes sparkPop {
    0%,70%,100% { opacity: 0; transform: translateY(0) scale(.6); }
    78% { opacity: 1; transform: translateY(-2px) scale(1.1); }
    90% { opacity: .7; transform: translateY(-1px) scale(1); }
  }

  /* --- idle_fresh: mild half-lids --- */
  .mood-fx .lid {
    position: absolute; left: 26%; top: 28%; width: 48%; height: 2px; background: #1a1010; opacity: .7;
  }
  .mood-fx .lid.half { opacity: .45; height: 2px; top: 27%; }

  /* --- bored: heavy lids + big floating Zzz --- */
  .mood-fx .lid.heavy {
    height: 4px; opacity: .9; top: 29%;
    animation: lidDroop 2.8s ease-in-out infinite;
  }
  .mood-fx .zzz {
    position: absolute; top: -2%; right: -6%; font-size: 11px; font-weight: 900;
    color: #a0b0c8; text-shadow: 1px 1px 0 #111; letter-spacing: -1px;
    animation: floatZ 2s ease-in-out infinite;
  }
  .mood-fx .zzz.z2 {
    top: 6%; right: -12%; font-size: 8px; opacity: .75;
    animation-delay: .45s; color: #8a9bb0;
  }
  .mood-fx .zzz.z3 {
    top: 14%; right: -4%; font-size: 7px; opacity: .55;
    animation-delay: .9s;
  }
  @keyframes floatZ {
    0%   { transform: translate(0,0) rotate(-6deg); opacity: .95; }
    50%  { transform: translate(3px,-6px) rotate(4deg); opacity: .45; }
    100% { transform: translate(5px,-11px) rotate(-2deg); opacity: 0; }
  }
  @keyframes lidDroop {
    0%,100% { transform: scaleY(1); }
    50% { transform: scaleY(1.35); }
  }

  /* Sprite motion per mood */
  .px-char[data-mood="working"] img.sprite {
    filter: saturate(1.1) contrast(1.06);
    animation: workBob 0.55s steps(2,end) infinite;
    transform-origin: bottom center;
  }
  .px-char[data-mood="done_recent"] img.sprite {
    filter: saturate(1.15) brightness(1.06);
    animation: happyBounce 2.4s ease-in-out infinite;
    transform-origin: bottom center;
  }
  .px-char[data-mood="idle_fresh"] img.sprite {
    filter: saturate(.78) brightness(.98);
  }
  .px-char[data-mood="bored"] img.sprite {
    filter: saturate(.35) brightness(.82) contrast(.92);
    animation: sleepNod 3.2s ease-in-out infinite;
    transform-origin: bottom center;
  }
  @keyframes workBob {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(1px) rotate(-1.5deg); }
  }
  @keyframes happyBounce {
    0%,70%,100% { transform: translateY(0); }
    78% { transform: translateY(-2px); }
    86% { transform: translateY(0); }
    92% { transform: translateY(-1px); }
  }
  @keyframes sleepNod {
    0%,100% { transform: translateY(1px) rotate(2deg); }
    50% { transform: translateY(3px) rotate(5deg); }
  }

  .px-char.sm { width: 26px; height: 34px; }
  .px-char.sm img.sprite { width: 26px; height: 34px; }
  .px-char.sm .status-dot { width: 6px; height: 6px; top: -1px; right: -3px; }
  .px-char.sm .mood-fx .sweat { width: 3px; height: 5px; }
  .px-char.sm .mood-fx .sweat.s1 { top: 10%; right: 0; }
  .px-char.sm .mood-fx .zzz { font-size: 8px; }
  .px-char.sm .mood-fx .zzz.z2 { font-size: 6px; }
  .px-char.sm .mood-fx .zzz.z3 { font-size: 5px; }
  .px-char.sm .mood-fx .smile { width: 8px; height: 4px; border-width: 1.5px; top: 34%; }
  .px-char.sm .mood-fx .blush { width: 3px; height: 2px; }
  .px-char.sm .mood-fx .lid { height: 2px; top: 26%; }
  .px-char.sm .mood-fx .lid.heavy { height: 3px; }
  .px-char.sm .mood-fx .spark { font-size: 7px; }
  .px-char.sm .mood-fx .speed { display: none; }


  /* Mood / expression examples strip */
  .mood-preview {
    margin: 0 0 16px; background: #1a1410cc; border: 3px solid #5a4030;
    border-radius: 4px; padding: 10px 12px 12px; box-shadow: 3px 3px 0 #00000033;
  }
  .mood-preview h3 {
    color: #f0e6d0; font-size: 12px; font-weight: 700; margin-bottom: 8px;
    letter-spacing: .04em; text-align: center;
  }
  .mood-preview-row {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 14px;
  }
  .mood-card {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    min-width: 64px;
  }
  .mood-card .mood-label {
    font-size: 10px; color: #e8eef6; text-align: center; line-height: 1.25;
    max-width: 76px;
  }
  .mood-card .mood-label .en {
    display: block; color: #8a9bb0; font-size: 9px; font-weight: 500;
  }
  .mood-card .desk-mini {
    background: var(--desk-top); border: 2px solid #5c4010; border-radius: 2px;
    padding: 6px 6px 4px; display: flex; justify-content: center;
  }

  .bulletin {
    background: #e8dcc8; border: 4px solid #5a4030; width: 200px; min-height: 260px;
    padding: 8px; box-shadow: 4px 4px 0 #00000022;
  }
  .bulletin h3 { color: #3a2a18; font-size: 13px; text-align: center; margin-bottom: 8px; }
  .bulletin-cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
  .b-col-title { font-size: 10px; color: #5a4030; text-align: center; font-weight: 700; margin-bottom: 4px; }
  .sticky {
    background: #ffe08a; border: 1px solid #d4b050; font-size: 9px; color: #3a2a10;
    padding: 3px 4px; margin-bottom: 3px; line-height: 1.2; word-break: break-all; min-height: 28px;
  }
  .sticky.todo { background: #ffd4a8; } .sticky.doing { background: #c8e8ff; } .sticky.done { background: #c8f0c8; }

  .reception { margin-top: 24px; display: flex; justify-content: center; gap: 24px; align-items: flex-end; }
  .rug { width: 160px; height: 28px; background: #a03030; border: 2px solid #701818; }
  .plant { width: 16px; height: 20px; background: #2a8a3a; border-radius: 50% 50% 0 0; position: relative; }
  .plant::after { content: ""; position: absolute; bottom: -6px; left: 4px; width: 8px; height: 8px; background: #8b6914; }

  .dash {
    background: var(--dash-bg); border-left: 1px solid var(--dash-border);
    padding: 16px 14px 20px; display: flex; flex-direction: column; gap: 14px;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--dash-border); }
  .brand-logo {
    width: 36px; height: 36px; background: #111820; border: 2px solid #3a8;
    display: grid; place-items: center; font-weight: 900; font-size: 18px; color: var(--green); font-family: monospace;
  }
  .brand h1 { font-size: 15px; font-weight: 700; line-height: 1.25; }
  .brand p { font-size: 10px; color: var(--muted); letter-spacing: .04em; }

  /* Live Hong Kong clock */
  .hk-clock {
    margin: 10px 0 4px; padding: 10px 12px;
    background: linear-gradient(180deg, #1a2838 0%, #121c28 100%);
    border: 1px solid #2a4058; border-radius: 6px;
    box-shadow: inset 0 0 0 1px #0a1018, 0 2px 0 #0004;
  }
  .hk-clock .hk-label {
    font-size: 10px; font-weight: 700; color: var(--muted);
    letter-spacing: .08em; margin-bottom: 4px;
  }
  .hk-clock .hk-label span.hkt { color: var(--yellow); }
  .hk-clock .hk-date {
    font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.3;
  }
  .hk-clock .hk-weekday {
    font-size: 13px; font-weight: 600; color: #9ec8ff; margin-top: 2px;
  }
  .hk-clock .hk-time {
    margin-top: 6px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 28px; font-weight: 800; color: var(--green);
    letter-spacing: .06em; line-height: 1; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 12px #3dcf7a55;
  }

  .card { background: var(--dash-card); border: 1px solid var(--dash-border); border-radius: 6px; padding: 10px 12px; }
  .card h2 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
  .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: #0f1824; border-radius: 4px; padding: 8px; }
  .stat .label { font-size: 10px; color: var(--muted); }
  .stat .value { font-size: 20px; font-weight: 700; color: var(--green); font-variant-numeric: tabular-nums; }
  .bar-track { height: 6px; background: #0a1018; border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--green), #6ae0a0); border-radius: 3px; transition: width .4s; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; font-size: 10px; color: var(--muted); }
  .legend span::before {
    content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; vertical-align: middle;
  }
  .legend .l-w::before { background: var(--green); } .legend .l-wa::before { background: var(--yellow); }
  .legend .l-i::before { background: #889; } .legend .l-c::before { background: var(--blue); }
  .timeline { max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .tl-item {
    display: grid; grid-template-columns: 40px 42px 1fr; gap: 6px; align-items: center;
    font-size: 11px; padding: 4px 0; border-bottom: 1px solid #1a2434;
  }
  .tl-time { color: var(--muted); font-variant-numeric: tabular-nums; }
  .tl-body { color: var(--text); min-width: 0; }
  .tl-body .task {
    color: var(--muted); display: block; font-size: 10px; margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .server-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .server {
    background: #121a28; border: 1px solid #2a3548; border-radius: 4px; padding: 6px 8px;
    position: relative; min-height: 60px; display: grid; grid-template-columns: 40px 1fr; gap: 6px; align-items: center;
  }
  .server .light {
    position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%;
    box-shadow: 0 0 6px currentColor;
  }
  .server .light.working { background: var(--green); color: var(--green); }
  .server .light.waiting { background: var(--yellow); color: var(--yellow); }
  .server .light.idle { background: #667; color: #667; }
  .server .light.completed { background: var(--blue); color: var(--blue); }
  .server .s-meta { min-width: 0; padding-right: 10px; }
  .server .s-task {
    font-size: 10px; color: var(--text); line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .server .s-name {
    display: inline-block; margin-top: 4px; font-size: 9px; background: var(--yellow); color: #1a1408;
    padding: 1px 5px; border-radius: 2px; font-weight: 600; max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 11px; }
  .toolbar label.btn, .toolbar button {
    background: #1e2a3c; border: 1px solid #3a4a60; color: var(--text);
    padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px;
  }
  .toolbar label.btn:hover, .toolbar button:hover { background: #2a3a50; }
  .toolbar input[type="file"] { display: none; }
  .source-note { font-size: 10px; color: var(--muted); line-height: 1.4; }
  .source-note.warn { color: var(--orange); } .source-note.ok { color: var(--green); }
  .waiting-banner {
    display: none; background: #2a2010; border: 1px solid var(--orange); color: var(--orange);
    padding: 8px 10px; border-radius: 4px; font-size: 12px; text-align: center;
  }
  .waiting-banner.show { display: block; }
  .update-pill {
    position: sticky; bottom: 8px; align-self: flex-end; background: #f0f4f8; color: #1a2030;
    font-size: 11px; font-weight: 600; padding: 6px 12px; border-radius: 999px;
    box-shadow: 0 2px 8px #0006; margin-top: auto;
  }
  .empty-hint { color: var(--muted); font-size: 11px; padding: 8px 0; }
</style>

const DONE_RECENT_MS = 1 * DAY_MS;   /* completed within 1 day */
const IDLE_FRESH_MAX_MS = 4 * DAY_MS; /* ≤4 days → idle_fresh; >4 → bored */
/* idle_fresh covers ~2–3d “剛 IDLE”; also fresh idle (<2d) */

function agentLastTs(agent, boardUpdatedAt) {
  /* Prefer lastActive / lastCompleted / updated_at */
  const candidates = [];
  if (agent) {
    if (agent.lastActive) candidates.push(agent.lastActive);
    if (agent.lastCompleted) candidates.push(agent.lastCompleted);
    if (agent.updated_at) candidates.push(agent.updated_at);
  }
  if (boardUpdatedAt) candidates.push(boardUpdatedAt);
  for (let i = 0; i < candidates.length; i++) {
    const t = new Date(candidates[i]).getTime();
    if (!isNaN(t)) return t;
  }
  return NaN;
}

function resolveMood(status, updatedAt, boardUpdatedAt, agent) {
  const st = (status || "idle").toLowerCase();
  const now = Date.now();
  const last = agent
    ? agentLastTs(agent, boardUpdatedAt)
    : (updatedAt ? new Date(updatedAt).getTime() : (boardUpdatedAt ? new Date(boardUpdatedAt).getTime() : NaN));
  const age = isNaN(last) ? IDLE_FRESH_MAX_MS + DAY_MS : (now - last);

  if (st === "working") return "working";

  /* done_recent: completed status OR lastCompleted within 1 day */
  const completedAt = agent && agent.lastCompleted
    ? new Date(agent.lastCompleted).getTime()
    : (st === "completed" ? last : NaN);
  if (st === "completed" || (!isNaN(completedAt) && (now - completedAt) <= DONE_RECENT_MS)) {
    if (!isNaN(completedAt) && (now - completedAt) <= DONE_RECENT_MS) return "done_recent";
    if (st === "completed" && age <= DONE_RECENT_MS) return "done_recent";
  }

  if (age > IDLE_FRESH_MAX_MS) return "bored";
  return "idle_fresh";
}

function moodLabel(mood) {
  return ({
    working: "忙碌 WORKING",
    done_recent: "剛完成任務",
    idle_fresh: "剛 IDLE",
    bored: "很悶"
  })[mood] || mood;
}
function moodLabelShort(mood) {
  return ({
    working: "忙碌",
    done_recent: "剛完成",
    idle_fresh: "剛 IDLE",
    bored: "很悶"
  })[mood] || mood;
}

function moodFxHTML(mood) {
  if (mood === "working") {
    return '<div class="mood-fx"><span class="speed"></span>' +
      '<span class="sweat s1"></span><span class="sweat s2"></span><span class="sweat s3"></span></div>';
  }
  if (mood === "done_recent") {
    return '<div class="mood-fx"><span class="spark">✦</span>' +
      '<span class="blush l"></span><span class="blush r"></span><span class="smile"></span></div>';
  }
  if (mood === "idle_fresh") {
    return '<div class="mood-fx"><span class="lid half"></span></div>';
  }
  if (mood === "bored") {
    return '<div class="mood-fx"><span class="lid heavy"></span>' +
      '<span class="zzz">Zzz</span><span class="zzz z2">Zz</span><span class="zzz z3">z</span></div>';
  }
  return '<div class="mood-fx"></div>';
}

function spriteSrc(id) {
  if (SPRITE_DATA[id]) return SPRITE_DATA[id];
  return "sprites/" + id + ".png";
}

function charHTML(id, status, sizeClass, updatedAt, boardUpdatedAt, agent) {
  const st = (status || "idle").toLowerCase();
  const mood = resolveMood(status, updatedAt, boardUpdatedAt, agent || { id:id, status:status, updated_at:updatedAt });
  const cls = "px-char" + (sizeClass ? " " + sizeClass : "");
  const src = spriteSrc(id);
  return (
    '<div class="' + cls + '" data-agent="' + escapeAttr(id) + '" data-mood="' + mood +
      '" title="' + escapeAttr(id + " · " + moodLabel(mood)) + '">' +
      '<img class="sprite" alt="' + escapeAttr(id) + '" src="' + src + '" />' +
      moodFxHTML(mood) +
      '<span class="status-dot ' + st + '"></span>' +
    "</div>"
  );
}


const MOOD_PREVIEW = [
  { mood: "working",     status: "working",   zh: "忙碌",       en: "WORKING" },
  { mood: "done_recent", status: "completed", zh: "剛完成任務", en: "done <1d" },
  { mood: "idle_fresh",  status: "idle",      zh: "剛 IDLE",    en: "idle 2–3d" },
  { mood: "bored",       status: "idle",      zh: "很悶",       en: "bored >4d" },
];
const MOOD_PREVIEW_AGENT = "langlang";

function renderMoodPreview() {
  const row = document.getElementById("mood-preview-row");
  if (!row) return;
  const now = Date.now();
  const stamps = {
    working: new Date(now - 10 * 60 * 1000).toISOString(),
    done_recent: new Date(now - 6 * 60 * 60 * 1000).toISOString(),
    idle_fresh: new Date(now - 2.5 * DAY_MS).toISOString(),
    bored: new Date(now - 5 * DAY_MS).toISOString(),
  };
  row.innerHTML = MOOD_PREVIEW.map(function (item) {
    const updated = stamps[item.mood];
    const agent = {
      id: MOOD_PREVIEW_AGENT,
      status: item.status,
      updated_at: updated,
      lastActive: updated,
      lastCompleted: item.mood === "done_recent" ? updated : undefined,
    };
    const htmlChar = charHTML(MOOD_PREVIEW_AGENT, item.status, "", updated, new Date().toISOString(), agent);
    return (
      '<div class="mood-card" data-preview-mood="' + item.mood + '">' +
        '<div class="desk-mini">' + htmlChar + '</div>' +
        '<div class="mood-label">' + item.zh + '<span class="en">' + item.en + '</span></div>' +
      '</div>'
    );
  }).join("");
  row.querySelectorAll(".mood-card").forEach(function (card) {
    const want = card.getAttribute("data-preview-mood");
    const el = card.querySelector(".px-char");
    if (!el || !want) return;
    el.setAttribute("data-mood", want);
    const fx = moodFxHTML(want);
    const old = el.querySelector(".mood-fx");
    if (old) old.outerHTML = fx;
    else el.insertAdjacentHTML("beforeend", fx);
  });
}


let currentData = null, dataSource = "none", pollTimer = null;

function shortTask(task, n) {
  if (!task) return "—";
  return task.length > n ? task.slice(0, n-1) + "…" : task;
}
function fmtTime(iso) {
  if (!iso) return "—";
  try {
    const d = new Date(iso);
    return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  } catch (e) { return "—"; }
}
function fmtUpdatePill(iso) {
  if (!iso) return "更新 —";
  try {
    const d = new Date(iso);
    return "更新 " + (d.getMonth()+1) + "/" + d.getDate() + " " +
      String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0") + " (台北時間)";
  } catch (e) { return "更新 —"; }
}
function escapeHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function escapeAttr(s) { return escapeHtml(s); }


const WEEKDAY_ZH = ["一","二","三","四","五","六","日"];
const WEEKDAY_EN = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const WEEK_BAR_MAX_PX = 16; /* tallest bar height in px */
let boardWeekMaxDay = 1;    /* shared scale across all desks */

function normalizeWeek(week) {
  if (!week || typeof week !== "object") {
    return { weekStart: null, completedByDay: null, completedTotal: null, activeDays: null, workingMinutes: null };
  }
  let days = Array.isArray(week.completedByDay) ? week.completedByDay.slice(0, 7) : null;
  if (days) {
    while (days.length < 7) days.push(0);
    days = days.map(function (n) { const v = Number(n); return isNaN(v) || v < 0 ? 0 : Math.floor(v); });
  }
  let total = week.completedTotal;
  if (total == null && days) total = days.reduce(function (a, b) { return a + b; }, 0);
  if (total != null) { total = Number(total); if (isNaN(total)) total = null; }
  let active = week.activeDays;
  if (active == null && days) active = days.filter(function (n) { return n > 0; }).length;
  return {
    weekStart: week.weekStart || null,
    completedByDay: days,
    completedTotal: total,
    activeDays: active == null ? null : Number(active),
    workingMinutes: week.workingMinutes == null ? null : Number(week.workingMinutes),
  };
}

function computeBoardWeekMaxDay(agents) {
  let m = 1;
  (agents || []).forEach(function (a) {
    const w = normalizeWeek(a && a.week);
    if (!w.completedByDay) return;
    w.completedByDay.forEach(function (n) { if (n > m) m = n; });
  });
  return Math.max(1, m);
}

function formatWorkMinutes(mins) {
  if (mins == null || isNaN(mins)) return null;
  const m = Math.max(0, Math.floor(mins));
  if (m < 60) return m + "m";
  const h = Math.floor(m / 60);
  const r = m % 60;
  return r ? (h + "h" + r + "m") : (h + "h");
}

function dayBarHeight(count, maxDay) {
  const scale = Math.max(1, maxDay || boardWeekMaxDay || 1);
  if (!count) return 2;
  return Math.max(4, Math.round((count / scale) * WEEK_BAR_MAX_PX));
}

function weekStatsHTML(agent) {
  const w = normalizeWeek(agent && agent.week);
  const scale = Math.max(1, boardWeekMaxDay || 1);
  const hasDays = !!w.completedByDay;
  const hasTotal = w.completedTotal != null;
  if (!hasDays && !hasTotal) {
    return (
      '<div class="week-stats" title="本週完成：暫無資料">' +
        '<div class="week-total">本週完成 <span class="num zero">—</span></div>' +
        '<div class="week-bars">' +
          WEEKDAY_ZH.map(function (lab, i) {
            return '<div class="d empty" title="' + WEEKDAY_EN[i] + " " + lab + ' 0">' +
              '<span class="cnt">0</span><div class="bar" style="height:2px"></div>' +
              '<span class="wd">' + lab + "</span></div>";
          }).join("") +
        '</div><div class="week-meta">活躍 —/7</div></div>'
    );
  }
  const days = hasDays ? w.completedByDay : [0,0,0,0,0,0,0];
  const total = hasTotal ? w.completedTotal : days.reduce(function (a, b) { return a + b; }, 0);
  const start = w.weekStart ? String(w.weekStart) : "";
  const bars = days.map(function (n, i) {
    const empty = !n;
    const h = dayBarHeight(n, scale);
    const tip = WEEKDAY_ZH[i] + " " + n + " / " + WEEKDAY_EN[i] + " " + n;
    return (
      '<div class="d' + (empty ? " empty" : "") + '" title="' + escapeAttr(tip) + '">' +
        '<span class="cnt">' + (n >= 1 ? n : "") + "</span>" +
        '<div class="bar" style="height:' + h + 'px"></div>' +
        '<span class="wd">' + WEEKDAY_ZH[i] + "</span></div>"
    );
  }).join("");
  const active = (w.activeDays != null && !isNaN(w.activeDays)) ? w.activeDays : days.filter(function (n) { return n > 0; }).length;
  const minsLabel = formatWorkMinutes(w.workingMinutes);
  const metaParts = ["活躍 " + active + "/7"];
  if (minsLabel) metaParts.push(minsLabel);
  const tipTotal = "本週完成 " + total + " 件 · scale max/day " + scale +
    (start ? " · week " + start : "") + " · " + metaParts.join(" · ");
  return (
    '<div class="week-stats" title="' + escapeAttr(tipTotal) + '">' +
      '<div class="week-total">本週完成 <span class="num' + (total === 0 ? " zero" : "") + '">' +
        escapeHtml(String(total)) + "</span></div>" +
      '<div class="week-bars">' + bars + "</div>" +
      '<div class="week-meta">' + escapeHtml(metaParts.join(" · ")) + "</div></div>"
  );
}

function weekRankHTML(agents) {
  const rows = (agents || []).map(function (a) {
    const w = normalizeWeek(a.week);
    const days = w.completedByDay || [0,0,0,0,0,0,0];
    const total = w.completedTotal != null ? w.completedTotal : days.reduce(function (x, y) { return x + y; }, 0);
    return { agent: a, days: days, total: total || 0 };
  }).sort(function (a, b) { return b.total - a.total; });
  if (!rows.length) return '<div class="empty-hint">暫無資料</div>';
  const scale = Math.max(1, boardWeekMaxDay || 1);
  return rows.map(function (row, idx) {
    const name = (row.agent.name || row.agent.id || "?").split(" - ")[0];
    const spark = row.days.map(function (n) {
      const h = n ? Math.max(2, Math.round((n / scale) * 10)) : 1;
      return '<i class="' + (n ? "" : "z") + '" style="height:' + h + 'px" title="' + n + '"></i>';
    }).join("");
    return (
      '<div class="week-rank-row" title="' + escapeAttr(name + " · 本週 " + row.total + " 件") + '">' +
        '<span class="rk' + (idx < 3 ? " top" : "") + '">' + (idx + 1) + "</span>" +
        '<div class="who"><div>' + escapeHtml(name) + '</div><div class="spark">' + spark + "</div></div>" +
        '<span class="tot' + (row.total === 0 ? " zero" : "") + '">' + row.total + "</span></div>"
    );
  }).join("");
}

function deskHTML(agent, boardUpdatedAt) {
  const st = (agent.status || "idle").toLowerCase();
  const mood = resolveMood(st, agent.updated_at, boardUpdatedAt, agent);
  return (
    '<div class="desk" data-id="' + escapeAttr(agent.id) + '" data-mood="' + mood + '">' +
      '<div class="status-placard ' + mood + '">' + escapeHtml(moodLabelShort(mood)) + "</div>" +
      '<div class="name-tag" title="' + escapeAttr(agent.name) + '">' + escapeHtml(agent.name) + "</div>" +
      weekStatsHTML(agent) +
      '<div class="desk-inner">' +
        '<div class="monitor ' + st + '"><div class="screen"></div></div>' +
        charHTML(agent.id, st, "", agent.updated_at, boardUpdatedAt, agent) +
      "</div></div>"
  );
}

function render(data) {
  currentData = data;
  const agents = Array.isArray(data.agents) ? data.agents.slice() : [];
  const banner = document.getElementById("waiting-banner");
  if (!agents.length) { banner.classList.add("show"); banner.textContent = "等待狀態資料中..."; }
  else banner.classList.remove("show");

  const boardUpdatedAt = data.updated_at;
  boardWeekMaxDay = computeBoardWeekMaxDay(agents);
  const mid = Math.ceil(agents.length / 2);
  document.getElementById("desks-left").innerHTML =
    agents.slice(0, mid).map(function (a) { return deskHTML(a, boardUpdatedAt); }).join("");
  document.getElementById("desks-right").innerHTML =
    agents.slice(mid).map(function (a) { return deskHTML(a, boardUpdatedAt); }).join("");

  const todo=[], doing=[], done=[];
  agents.forEach(function (a) {
    const st=(a.status||"").toLowerCase();
    const label=shortTask(a.name.split(" - ")[0]||a.name, 8);
    if (st==="waiting"||st==="idle") todo.push({label:label, cls:"todo"});
    else if (st==="working") doing.push({label:label, cls:"doing"});
    else if (st==="completed") done.push({label:label, cls:"done"});
  });
  function fillBoard(id, items) {
    document.getElementById(id).innerHTML = items.slice(0,5).map(function (it) {
      return '<div class="sticky ' + it.cls + '">' + escapeHtml(it.label) + "</div>";
    }).join("") || '<div class="sticky" style="opacity:0.4">—</div>';
  }
  fillBoard("board-todo", todo); fillBoard("board-doing", doing); fillBoard("board-done", done);

  let nW=0,nWa=0,nI=0,nC=0;
  agents.forEach(function (a) {
    const st=(a.status||"").toLowerCase();
    if (st==="working") nW++; else if (st==="waiting") nWa++; else if (st==="idle") nI++; else if (st==="completed") nC++;
  });
  document.getElementById("stat-working").textContent=nW;
  document.getElementById("stat-other").textContent=nWa+nI;
  document.getElementById("stat-done").textContent=nC;
  document.getElementById("stat-total").textContent=agents.length;
  document.getElementById("progress-bar").style.width=(agents.length?Math.round((nC/agents.length)*100):0)+"%";

  const sorted=agents.slice().sort(function(a,b){ return new Date(b.updated_at)-new Date(a.updated_at); });
  document.getElementById("timeline").innerHTML = sorted.length ? sorted.map(function (a) {
    return '<div class="tl-item">' + charHTML(a.id, a.status, "sm", a.updated_at, boardUpdatedAt, a) +
      '<div class="tl-time">' + fmtTime(a.updated_at) + '</div>' +
      '<div class="tl-body">' + escapeHtml(a.name) + ' · <em style="font-style:normal;color:var(--muted)">' +
      escapeHtml(a.status) + '</em><span class="task">' + escapeHtml(shortTask(a.task, 36)) + '</span></div></div>';
  }).join("") : '<div class="empty-hint">暫無動態</div>';

  document.getElementById("server-grid").innerHTML = agents.map(function (a) {
    const st=(a.status||"idle").toLowerCase();
    return '<div class="server"><span class="light ' + st + '"></span>' +
      charHTML(a.id, st, "sm", a.updated_at, boardUpdatedAt, a) +
      '<div class="s-meta"><div class="s-task" title="' + escapeAttr(a.task||"") + '">' +
      escapeHtml(shortTask(a.task, 36)) + '</div><span class="s-name">' + escapeHtml(a.name) + '</span></div></div>';
  }).join("");

  document.getElementById("update-pill").textContent = fmtUpdatePill(data.updated_at);
  const wr = document.getElementById("week-rank");
  if (wr) wr.innerHTML = weekRankHTML(agents);
  updateSourceNote();
  renderMoodPreview();
}

function updateSourceNote() {
  const el=document.getElementById("source-note");
  if (dataSource==="fetch"){ el.className="source-note ok"; el.textContent="來源：status.json（每 5 秒刷新）"; }
  else if (dataSource==="file"){ el.className="source-note ok"; el.textContent="來源：已用 Load JSON 載入（本地檔）"; }
  else if (dataSource==="embedded"){ el.className="source-note warn"; el.textContent="fetch 失敗 → 用內嵌 sample。可按 Load JSON 載入 status.json"; }
  else { el.className="source-note warn"; el.textContent="等待狀態資料中..."; }
}

async function tryFetch() {
  try {
    const res=await fetch("status.json",{cache:"no-store"});
    if (!res.ok) throw new Error("HTTP "+res.status);
    const data=await res.json();
    if (!data||!Array.isArray(data.agents)) throw new Error("bad shape");
    dataSource="fetch"; render(data); return true;
  } catch (e) { return false; }
}

async function loadInitial() {
  const ok=await tryFetch();
  if (!ok){ dataSource="embedded"; render(EMBEDDED_SAMPLE); }
  if (pollTimer) clearInterval(pollTimer);
  pollTimer=setInterval(async function(){
    if (dataSource==="file") return;
    const ok2=await tryFetch();
    if (!ok2 && dataSource==="fetch"){ dataSource="embedded"; updateSourceNote(); }
  }, 5000);
}

document.getElementById("file-input").addEventListener("change", function (ev) {
  const file=ev.target.files&&ev.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(){
    try {
      const data=JSON.parse(reader.result);
      if (!data||!Array.isArray(data.agents)) throw new Error("agents missing");
      dataSource="file"; render(data);
    } catch (err) { alert("JSON 讀取失敗："+err.message); }
  };
  reader.readAsText(file);
});
document.getElementById("btn-reload").addEventListener("click", function(){ loadInitial(); });

/* Live clock — always Asia/Hong_Kong, not browser-local alone */
const HK_TZ = "Asia/Hong_Kong";
const HK_WEEKDAY = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
let hkClockTimer = null;

function hkParts(date) {
  const d = date || new Date();
  const fmt = new Intl.DateTimeFormat("en-GB", {
    timeZone: HK_TZ,
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit",
    hourCycle: "h23", weekday: "short",
  });
  const map = {};
  fmt.formatToParts(d).forEach(function (p) {
    if (p.type !== "literal") map[p.type] = p.value;
  });
  /* weekday: map en short → 0..6 via a reliable HK calendar day */
  const wdFmt = new Intl.DateTimeFormat("en-US", { timeZone: HK_TZ, weekday: "short" });
  const wdEn = wdFmt.format(d); /* Sun Mon ... */
  const wdIdx = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 }[wdEn] ;
  return {
    year: map.year,
    month: map.month,
    day: map.day,
    hour: map.hour,
    minute: map.minute,
    second: map.second,
    weekdayZh: HK_WEEKDAY[wdIdx != null ? wdIdx : 0],
  };
}

function renderHkClock() {
  const elDate = document.getElementById("hk-date");
  const elWd = document.getElementById("hk-weekday");
  const elTime = document.getElementById("hk-time");
  if (!elDate || !elWd || !elTime) return;
  const p = hkParts(new Date());
  /* strip leading zeros for month/day in 中文 date feel, keep numeric pad for time */
  const mNum = String(parseInt(p.month, 10));
  const dNum = String(parseInt(p.day, 10));
  elDate.textContent = p.year + "年" + mNum + "月" + dNum + "日";
  elWd.textContent = p.weekdayZh;
  elTime.textContent = p.hour + ":" + p.minute + ":" + p.second;
}

function startHkClock() {
  renderHkClock();
  if (hkClockTimer) clearInterval(hkClockTimer);
  hkClockTimer = setInterval(renderHkClock, 1000);
}

renderMoodPreview();
startHkClock();
loadInitial();
